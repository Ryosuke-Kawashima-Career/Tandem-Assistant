[project]
name = "echosphere"
version = "1.1.0"
description = "EchoSphere Tandem Co-Teacher: Real-Time AI-Augmented Peer Language Learning Platform on Agora SD-RTN"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "EchoSphere Team" }
]
dependencies = [
    "agora-token-builder>=1.0.0",
    "edge-tts>=6.1.12",
    "fastapi>=0.111.0",
    "google-genai>=0.1.1",
    "gtts>=2.5.1",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "scipy>=1.13.0",
    "setuptools>=70.0.0,<72.0.0",
    "uvicorn[standard]>=0.30.0",
    "webrtcvad>=2.0.10",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:webrtcvad.*",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
